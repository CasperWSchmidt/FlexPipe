name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.majorMinorPatch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required by GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: version
        uses: gittools/actions/gitversion/execute@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore FlexPipe.slnx

      - name: Build
        run: >
          dotnet build FlexPipe.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.majorMinorPatch }}

      - name: Test
        run: >
          dotnet test FlexPipe.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Pack
        run: |
          dotnet pack src/FlexPipe/FlexPipe.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.majorMinorPatch }} \
            --output ./artifacts
          dotnet pack src/FlexPipe.Extensions.DependencyInjection/FlexPipe.Extensions.DependencyInjection.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.majorMinorPatch }} \
            --output ./artifacts
          dotnet pack src/FlexPipe.Extensions.SimpleInjector/FlexPipe.Extensions.SimpleInjector.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.majorMinorPatch }} \
            --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Tag release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag v${{ steps.version.outputs.majorMinorPatch }}
          git push origin v${{ steps.version.outputs.majorMinorPatch }}

  release:
    name: Release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-and-test.outputs.version }}
          name: v${{ needs.build-and-test.outputs.version }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
